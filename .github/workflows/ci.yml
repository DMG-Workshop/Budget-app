name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned. A Flutter bump should be a visible change to this file, not
  # something that happens on its own between two runs of the same commit.
  FLUTTER_VERSION: "3.47.5"

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve audit_core
        working-directory: packages/audit_core
        run: dart pub get

      - name: Resolve the app
        working-directory: app
        run: flutter pub get

      - name: Analyze audit_core
        working-directory: packages/audit_core
        run: dart analyze --fatal-infos

      - name: Analyze the app
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Test audit_core
        working-directory: packages/audit_core
        run: dart test

      - name: Test the app
        working-directory: app
        run: flutter test

  contract-in-sync:
    name: Contract is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve audit_core
        working-directory: packages/audit_core
        run: dart pub get

      # The schema and the prompt are authored in Dart and exported to
      # contracts/, which anything that is not Dart reads. If the exporter
      # produces a diff, someone changed the prompt or the schema without
      # re-exporting, and the two halves have silently drifted apart.
      - name: Re-export and diff
        working-directory: packages/audit_core
        run: dart run tool/export_contract.dart

      - name: Fail if the export changed anything
        run: |
          if ! git diff --exit-code -- contracts/; then
            echo "::error::contracts/ is stale. Run 'dart run tool/export_contract.dart' in packages/audit_core and commit the result."
            exit 1
          fi

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve the app
        working-directory: app
        run: flutter pub get

      # This is the step that cannot be run in the development container,
      # which has no Android SDK and no access to Google's Maven. It is the
      # reason this workflow exists.
      #
      # pdfium is fetched at build time by pdfium_dart's native-asset hook,
      # so this step needs outbound network as well as the SDK.
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coldwater-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  server-contract-tests:
    name: Server contract parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        working-directory: server
        run: pip install -r requirements-dev.txt

      # The server is parked mid-build, but these tests are what stop its
      # prompt drifting from the app's, so they run on every commit.
      - name: Contract parity
        working-directory: server
        run: python -m pytest tests/test_contract_parity.py -q
