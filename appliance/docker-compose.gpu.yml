# NVIDIA GPU support for the model runtime.
#
# An override rather than a profile: a device reservation on a host with no
# NVIDIA container runtime refuses to start, so it cannot live in the base
# file, and a profile would have made the model server opt-in — which would
# leave `docker compose up -d` serving a web UI with nothing behind it.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Requires the NVIDIA Container Toolkit on the host.

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
