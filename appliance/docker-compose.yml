# Coldwater, as an appliance.
#
# Three containers: the audit server, a local model runtime, and a reverse
# proxy that gives the whole thing a name and a certificate.
#
# The proxy is not decoration. Both Android and iOS block plain HTTP by
# default, and Android in particular cannot be told "allow any address on my
# Wi-Fi" — its network security config matches DNS suffixes and has no
# wildcard for IP literals. Serving HTTPS at coldwater.local sidesteps that
# entirely: the phone apps talk to a name, over TLS, with no cleartext
# exemption needed at all.
#
#   docker compose up -d
#
# With an NVIDIA GPU, layer the override on top:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

name: coldwater

services:
  coldwater:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: coldwater:local
    restart: unless-stopped
    environment:
      # Default to the Ollama container beside it, so a fresh appliance works
      # with no configuration and nothing leaving the network.
      COLDWATER_PROVIDER: ${COLDWATER_PROVIDER:-local}
      COLDWATER_LOCAL_FLAVOR: ${COLDWATER_LOCAL_FLAVOR:-ollama}
      COLDWATER_BASE_URL: ${COLDWATER_BASE_URL:-http://ollama:11434}
      COLDWATER_MODEL: ${COLDWATER_MODEL:-llama3.1:8b}
      # Unset by default. Set it when the appliance is reachable by anyone you
      # would not hand the statement to.
      COLDWATER_TOKEN: ${COLDWATER_TOKEN:-}
      COLDWATER_CURRENCY: ${COLDWATER_CURRENCY:-}
    volumes:
      - coldwater-data:/data
    # Not published on the host: everything reaches it through Caddy, so
    # there is no unencrypted port sitting open on the LAN.
    expose:
      - "8080"
    networks: [coldwater]

  ollama:
    image: docker.io/ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    networks: [coldwater]
    # No profile. A service with any profile set is opt-in, so putting one
    # here would mean `docker compose up -d` brought up the web server and
    # the proxy with no model behind them — which looks like it worked right
    # up until the first audit. GPU support is an override file instead, for
    # the same reason: a device reservation on a host without an NVIDIA
    # runtime refuses to start, so it cannot be the default.

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    depends_on: [coldwater]
    ports:
      # Overridable because rootless Podman cannot bind below 1024. Set
      # COLDWATER_HTTP_PORT=8080 and COLDWATER_HTTPS_PORT=8443 there; Docker
      # keeps the privileged defaults so the appliance answers on the plain
      # https://coldwater.local the phones expect.
      - "${COLDWATER_HTTP_PORT:-80}:80"
      - "${COLDWATER_HTTPS_PORT:-443}:443"
    volumes:
      # ",z" relabels for SELinux, which Fedora and RHEL enforce and Podman
      # respects. Docker and non-SELinux hosts ignore it.
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
      - caddy-config:/config
    networks: [coldwater]

volumes:
  coldwater-data:
  ollama-models:
  caddy-data:
  caddy-config:

networks:
  coldwater:
    driver: bridge
