name: audit_core
description: Provider-agnostic core for Coldwater, the statement auditor — the audit schema, the Harsh Auditor prompt, PDF-aware provider wrapping, and the arithmetic verifier. Pure Dart, no Flutter.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  # The AI layer: provider adapters, capabilities, transport, schema dialects,
  # tolerant JSON extraction and the schema validator all come from EchoCodex.
  # Pinned to a commit rather than a branch — an audit that silently changes
  # behaviour because an upstream branch moved is the opposite of what this
  # app is for.
  transcript_core:
    git:
      url: https://github.com/DMG-Workshop/EchoCodex.git
      path: packages/transcript_core
      ref: f21e195103bc9567458f39a91670e464121d6ef3

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
